# CONFIGURACIÓN PARA TESTS (incluye el test del calificador)

# En el runner no hay PostgreSQL: por defecto se usa H2 en memoria
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:clientes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

management.server.port=
