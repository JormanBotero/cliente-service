# ═══════════════════════════════════════════════════════════
# INFORMACIÓN DE LA APLICACIÓN
# ═══════════════════════════════════════════════════════════
spring.application.name=cliente-service
app.version=0.2.0
api.version=v1

# ═══════════════════════════════════════════════════════════
# SERVIDOR WEB
# ═══════════════════════════════════════════════════════════
server.port=8080

# ═══════════════════════════════════════════════════════════
# BASE DE DATOS — PostgreSQL
# ═══════════════════════════════════════════════════════════
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/curso_springboot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devdb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:a1b2c3d4}



# ═══════════════════════════════════════════════════════════
# POOL DE CONEXIONES — HikariCP
# ═══════════════════════════════════════════════════════════
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ClienteHikariPool
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000

# ═══════════════════════════════════════════════════════════
# JPA / HIBERNATE
# ═══════════════════════════════════════════════════════════

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# ═══════════════════════════════════════════════════════════
# SPRING ACTUATOR
# ═══════════════════════════════════════════════════════════
management.server.port=8081
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ═══════════════════════════════════════════════════════════
# LOGGING
# ═══════════════════════════════════════════════════════════
logging.level.com.denkitronik.clienteservice=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ═══════════════════════════════════════════════════════════
# CARGA DE ARCHIVOS
# ═══════════════════════════════════════════════════════════
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ═══════════════════════════════════════════════════════════
# INICIALIZACIÓN SQL
# ═══════════════════════════════════════════════════════════
spring.sql.init.mode=never